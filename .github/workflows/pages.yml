name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build_website.py"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-after-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Release events run on a tag. Keep Pages deployment on main so the
      # existing github-pages environment protection continues to apply.
      - name: Refresh website from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
      - name: Build website with latest release links
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_website.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/website
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
